name: 'AI PR Code Reviewer'
description: 'Runs automated LLM reviews on PR diffs via OpenRouter or Anthropic and submits inline comments.'
author: 'meni'
branding:
  icon: 'code'
  color: 'blue'

inputs:
  provider:
    description: "LLM provider to use: 'openrouter' or 'anthropic'"
    required: false
    default: 'openrouter'
  openrouter_api_key:
    description: 'API key for OpenRouter (required when provider is openrouter)'
    required: false
  openrouter_model:
    description: 'Model to use for code review'
    required: false
    default: 'openrouter/free'
  openrouter_base_url:
    description: 'Base URL for OpenRouter completions API'
    required: false
    default: 'https://openrouter.ai/api/v1/chat/completions'
  openrouter_max_tokens:
    description: 'Maximum tokens for LLM response'
    required: false
    default: '8192'
  anthropic_api_key:
    description: 'API key for Anthropic (when provider is anthropic; alternative to claude_code_oauth_token). If both are set, claude_code_oauth_token takes precedence.'
    required: false
  claude_code_oauth_token:
    description: 'OAuth token for a Claude Pro/Max subscription, generated via `claude setup-token` (when provider is anthropic; alternative to anthropic_api_key). If both are set, this takes precedence over anthropic_api_key.'
    required: false
  anthropic_model:
    description: 'Claude model to use for code review'
    required: false
    default: 'claude-haiku-4-5'
  anthropic_base_url:
    description: 'Base URL for the Anthropic Messages API'
    required: false
    default: 'https://api.anthropic.com/v1/messages'
  anthropic_max_tokens:
    description: 'Maximum tokens for the Claude response'
    required: false
    default: '8192'
  github_token:
    description: 'GITHUB_TOKEN for posting review comments'
    required: false
    default: '${{ github.token }}'
  post_summary:
    description: 'Whether to post the high-level summary as the review body'
    required: false
    default: 'true'
  exclude_patterns:
    description: 'Comma or newline separated custom regex patterns to exclude from review'
    required: false
    default: ''


runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fetch PR Diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
      run: |
        gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > pr.diff

    - name: Run Review Script
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
        OPENROUTER_BASE_URL: ${{ inputs.openrouter_base_url }}
        OPENROUTER_MAX_TOKENS: ${{ inputs.openrouter_max_tokens }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_MAX_TOKENS: ${{ inputs.anthropic_max_tokens }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.github_token }}
        POST_SUMMARY: ${{ inputs.post_summary }}
        EXCLUDE_PATTERNS: ${{ inputs.exclude_patterns }}
      run: python ${{ github.action_path }}/src/pr_review.py

